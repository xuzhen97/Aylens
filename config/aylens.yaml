version: 1

auth:
  apiKey: "${AYLENS_API_KEY:-dev-key}"
  runnerTokens:
    dev-runner: "${AYLENS_RUNNER_TOKEN:-dev-runner-token}"

providers:
  generic-browser:
    type: generic-browser
  x:
    type: x-search

routes:
  default:
    providers:
      - generic-browser
  x:
    providers:
      - x
