version: 1

server:
  host: 127.0.0.1
  port: 3000
  runnerPath: /v1/runners/connect

auth:
  apiKey: "${AYLENS_API_KEY:-dev-key}"
  runnerTokens:
    windows-generic-01: "${AYLENS_RUNNER_TOKEN:-dev-runner-token}"

runtimeRegistry:
  heartbeatTimeoutMs: 30000
  offlineAfterMs: 60000
  jobTimeoutMs: 60000

transports:
  direct:
    type: direct

providers:
  generic-browser:
    type: generic-browser
    enabled: true

    runtime:
      selector:
        os: windows
        providerType: generic-browser
        browser: chrome
        profile: generic-login

    browser:
      profile: generic-login

    options:
      waitUntil: domcontentloaded
      timeoutMs: 30000
      extractionTimeoutMs: 10000
      postLoadDelayMs: 0
      maxTextChars: 50000
      snippetChars: 500
      textSelector: body

      # Useful while manually establishing a login session.
      # Set false after the profile is logged in to avoid accumulating tabs.
      keepPageOpen: true

routes:
  default:
    providers:
      - generic-browser

browserProfiles: {}
