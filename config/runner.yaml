runner:
  id: dev-runner
  gatewayUrl: "ws://127.0.0.1:3000/v1/runners/connect"
  token: "${AYLENS_RUNNER_TOKEN:-dev-runner-token}"

plugins:
  modules:
    - "builtin:generic-browser"
    - "builtin:x-search"

browser:
  # 多个浏览器 Provider 默认共用这个持久化 Profile，统一保存各站点登录状态。
  defaultProfile: browser-main

providers:
  generic-browser:
    type: generic-browser
  x:
    type: x-search

transports:
  proxy-main:
    type: http-proxy
    url: "http://127.0.0.1:10808"

browserProfiles:
  browser-main:
    mode: cdp
    userDataDir: "./.profiles/browser-main"
    cdpEndpoint: "http://127.0.0.1:9222"
    autoStart: true
    interactive: true
    transport: proxy-main
