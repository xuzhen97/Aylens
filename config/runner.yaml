runner:
  id: dev-runner
  gatewayUrl: "ws://127.0.0.1:3000/v1/runners/connect"
  token: "${AYLENS_RUNNER_TOKEN:-dev-runner-token}"

plugins:
  modules:
    - "builtin:generic-browser"

providers:
  generic-browser:
    type: generic-browser
    browser:
      profile: generic-login

browserProfiles:
  generic-login:
    userDataDir: "./.profiles/generic-login"
    headless: true
